<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>tide — live adaptation</title>
<style>
  :root {
    --bg0: #0e1418;
    --bg1: #162028;
    --ink: #e6eef2;
    --muted: #8aa0ad;
    --accent: #3dd6c6;
    --warn: #e6b35a;
    --bad: #e06c75;
    --grid: #24313a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 500px at 10% -10%, #1c3a3a 0%, transparent 55%),
      radial-gradient(700px 400px at 100% 0%, #2a2438 0%, transparent 50%),
      linear-gradient(165deg, var(--bg0), var(--bg1));
  }
  header {
    padding: 1.25rem 1.5rem 0.5rem;
    display: flex; flex-wrap: wrap; gap: 1rem; align-items: baseline;
  }
  h1 {
    margin: 0; font-size: clamp(1.6rem, 3vw, 2.2rem);
    font-family: "IBM Plex Serif", Georgia, serif;
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 0.95rem; }
  .score-eq {
    margin: 0 1.5rem 1rem;
    padding: 0.65rem 0.9rem;
    border-left: 3px solid var(--accent);
    background: rgba(61,214,198,0.06);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.85rem;
  }
  main {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 1rem;
    padding: 0 1.5rem 1.5rem;
  }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  section {
    background: rgba(0,0,0,0.22);
    border: 1px solid var(--grid);
    padding: 1rem;
  }
  h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  canvas { width: 100%; height: 260px; display: block; background: rgba(0,0,0,0.25); }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  th, td { text-align: left; padding: 0.35rem 0.4rem; border-bottom: 1px solid var(--grid); }
  th { color: var(--muted); font-weight: 500; }
  .ok { color: var(--accent); }
  .fail { color: var(--bad); }
  .gap { color: var(--warn); }
  .pill {
    display: inline-block; padding: 0.15rem 0.45rem;
    border: 1px solid var(--grid); font-size: 0.75rem; color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <h1><span>tide</span> live adaptation</h1>
  <div class="meta" id="status">connecting…</div>
</header>
<p class="score-eq">Score = Throughput × Availability% × AvgAccuracy% / 10,000</p>
<main>
  <section>
    <h2>Score pulse</h2>
    <canvas id="chart" width="900" height="260"></canvas>
  </section>
  <section>
    <h2>Current</h2>
    <div id="current" class="meta">—</div>
    <h2 style="margin-top:1.25rem">Best (3 metrics + Score)</h2>
    <div id="bests" class="meta">—</div>
    <h2 style="margin-top:1.25rem">Leaderboard</h2>
    <div style="overflow:auto; max-height:320px">
      <table>
        <thead><tr><th>#</th><th>Cell</th><th>Score</th><th>Acc</th><th>Thru</th><th>Avail</th><th>St</th></tr></thead>
        <tbody id="board"></tbody>
      </table>
    </div>
  </section>
</main>
<script>
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
const series = []; // {t, score, acc, thru}

function draw() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle = '#24313a';
  for (let i = 0; i < 5; i++) {
    const y = 20 + i * ((h-40)/4);
    ctx.beginPath(); ctx.moveTo(40,y); ctx.lineTo(w-10,y); ctx.stroke();
  }
  if (series.length < 2) return;
  const maxS = Math.max(...series.map(p => p.score), 1e-6);
  const maxA = 100;
  const plot = (key, color, maxV) => {
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
    series.forEach((p,i) => {
      const x = 40 + i * ((w-50) / Math.max(series.length-1,1));
      const y = h-20 - (p[key]/maxV) * (h-40);
      if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();
  };
  plot('score', '#3dd6c6', maxS);
  plot('acc', '#e6b35a', maxA);
  plot('thru', '#7aa2f7', Math.max(...series.map(p => p.thru), 1));
}

async function tick() {
  try {
    const r = await fetch('/api/live');
    const j = await r.json();
    const st = document.getElementById('status');
    st.textContent = `${j.message || ''} · batch ${j.batch_index+1}/${j.batch_total || 0} · cell ${j.cell_index+1}/${j.cell_total || 0} · phase ${j.phase || '—'} · ${j.running ? 'RUNNING' : 'idle'}`;
    const cur = document.getElementById('current');
    if (j.current) {
      const s = j.current.snapshot || {};
      cur.innerHTML = `<div><span class="pill">${j.current.cell.id}</span></div>
        <div style="margin-top:0.5rem">score <b>${(s.score||0).toFixed(3)}</b> · acc ${(s.avg_accuracy||0).toFixed(1)}% · thru ${(s.throughput||0).toFixed(1)}/s · avail ${(s.availability||0).toFixed(1)}%</div>`;
      series.push({t: Date.now(), score: s.score||0, acc: s.avg_accuracy||0, thru: s.throughput||0});
      if (series.length > 180) series.shift();
      draw();
    }
    const bestEl = document.getElementById('bests');
    const b = j.best || {};
    const line = (label, row, key) => {
      if (!row) return `<div>${label}: —</div>`;
      const s = row.snapshot || {};
      const v = key === 'score' ? (s.score||0).toFixed(3)
        : key === 'acc' ? (s.avg_accuracy||0).toFixed(1)+'%'
        : key === 'thru' ? (s.throughput||0).toFixed(1)+'/s'
        : (s.availability||0).toFixed(1)+'%';
      return `<div><span class="pill">${label}</span> ${v} · ${row.cell.id}</div>`;
    };
    bestEl.innerHTML = [
      line('score', b.score, 'score'),
      line('throughput', b.throughput, 'thru'),
      line('availability', b.availability, 'avail'),
      line('accuracy', b.accuracy, 'acc'),
    ].join('');
    const tb = document.getElementById('board');
    tb.innerHTML = (j.leaderboard||[]).map((row,i) => {
      const s = row.snapshot || {};
      return `<tr>
        <td>${i+1}</td>
        <td>${row.cell.id}</td>
        <td>${(s.score||0).toFixed(3)}</td>
        <td>${(s.avg_accuracy||0).toFixed(1)}</td>
        <td>${(s.throughput||0).toFixed(1)}</td>
        <td>${(s.availability||0).toFixed(1)}</td>
        <td class="${row.status}">${row.status}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    document.getElementById('status').textContent = 'waiting for /api/live…';
  }
}
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
